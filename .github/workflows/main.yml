name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build Unsigned App
        run: |
          set -e
          xcodebuild -project LiquidCRM.xcodeproj \
            -scheme LiquidCRM \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          set -e
          echo "=== Ищем скомпилированное приложение ==="
          find build -name "*.app" -type d
          
          # Универсальный поиск .app файла в папке build
          APP_PATH=$(find build -name "LiquidCRM.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            # Если по имени не нашлось, берём первый попавшийся .app
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "Ошибка: .app файл не найден!"
            exit 1
          fi

          echo "Найден файл приложения: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r LiquidCRM.ipa Payload
          ls -lh LiquidCRM.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiquidCRM-Installer
          path: LiquidCRM.ipa
