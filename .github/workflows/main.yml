name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build App
        run: |
          set -e
          xcodebuild -project LiquidCRM.xcodeproj \
            -scheme LiquidCRM \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build -name "LiquidCRM.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Ошибка: .app файл не найден!"
            exit 1
          fi

          echo "Найден файл приложения: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r LiquidCRM.ipa Payload
          ls -lh LiquidCRM.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiquidCRM-Installer
          path: LiquidCRM.ipa
