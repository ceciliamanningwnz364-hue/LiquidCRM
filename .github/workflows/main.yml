name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build Archive
        run: |
          set -e
          xcodebuild archive \
            -project LiquidCRM.xcodeproj \
            -scheme LiquidCRM \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/LiquidCRM.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual

      - name: Package IPA
        run: |
          set -e
          APP_PATH="build/LiquidCRM.xcarchive/Products/Applications/LiquidCRM.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "Ошибка: .app файл не найден в архиве!"
            exit 1
          fi

          echo "Найден файл приложения: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r LiquidCRM.ipa Payload
          ls -lh LiquidCRM.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiquidCRM-Installer
          path: LiquidCRM.ipa
