name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild -project LiquidCRM.xcodeproj \
            -scheme LiquidCRM \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Debug and Package IPA
        run: |
          set -e
          echo "=== Поиск всех .app файлов на сервере ==="
          find . -name "*.app" -type d

          # Ищем в локальной папке build или в системном кэше DerivedData
          APP_PATH=$(find build -name "LiquidCRM.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "LiquidCRM.app" -type d | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Ошибка: .app файл физически не найден!"
            exit 1
          fi

          echo "Найден файл приложения: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          ls -la Payload
          zip -r LiquidCRM.ipa Payload
          ls -lh LiquidCRM.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiquidCRM-Installer
          path: LiquidCRM.ipa
