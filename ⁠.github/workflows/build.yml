name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild -project LiquidCRM.xcodeproj \
            -scheme LiquidCRM \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LiquidCRM.app Payload/
          zip -r LiquidCRM.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiquidCRM-Installer
          path: LiquidCRM.ipa
